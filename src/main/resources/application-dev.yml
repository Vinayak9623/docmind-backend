# database config
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true



#open ai configuration
  ai:
    openai:
      api-key: ${OPEN_API_KEY:demosk-proj-kpjIvdwHdtq5ZY9CdWPXJIW59m96yoQPNhpZyOAn32ZmwCNgzm6MAGqTvAKLwwNDs_xYBGy7M-T3BlbkFJ5TXHnr7LM78RuOC4Ow22HHNkLn0IlM03kw5sXgkye8iMiIr8frSBbN-xj52nrdebdMGJ9oxv0A}
      chat:
        model: ${OPENAPI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.2
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}


    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB


#app configurations

app:
  rag:
    chunk-size: 600
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
